name: Isolated local prototype verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: fictional-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports: [1125:1025, 8125:8025]
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:fictional-ci-only@127.0.0.1:5432/postgres
      TEST_MAILPIT_EXTERNAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run verify:isolated
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-verification
          path: |
            docs/evidence/repair/
            playwright-report/
