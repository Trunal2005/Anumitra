services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: anumitra
      POSTGRES_USER: anumitra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anumitra"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: ["maildata:/data"]
  app:
    build: .
    environment: &appenv
      DATABASE_URL: postgresql://anumitra:${POSTGRES_PASSWORD}@postgres:5432/anumitra
      SESSION_SECRET: ${SESSION_SECRET:?Set a random local session secret}
      DEMO_MODE: "true"
      NODE_ENV: development
      HOST: 0.0.0.0
      APP_ORIGIN: http://127.0.0.1:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_PATH: /app/storage/private
    command: sh -c "npm run db:migrate && npm run db:seed && npm start"
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["documents:/app/storage", "localconfig:/app/.local"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1))",
        ]
      interval: 10s
      retries: 10
  worker:
    build: .
    environment: *appenv
    command: npm run worker
    volumes: ["documents:/app/storage"]
    depends_on:
      app:
        condition: service_healthy
volumes:
  pgdata:
  documents:
  maildata:
  localconfig:
